name: GEO Knowledge Graph Audit & Weekly Brief

on:
  schedule:
    # Run weekly on Tuesdays at 02:00 UTC
    - cron: '0 2 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  geo-audit:
    name: Audit Princeton GEO Metrics & Dispatch Brief
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Execute GEO Engine & Knowledge Graph Export
        env:
          TARGET_EMAIL: "workwithavip@gmail.com"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/geo_engine.py

      - name: Commit Knowledge Graph JSON-LD
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A output/
          git diff --staged --quiet || (git commit -m "chore(geo): update Schema.org Knowledge Graph JSON-LD" && git push)
